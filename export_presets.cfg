[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="world/*.json, world/levels/*.json, world/nature/*.json, art/v2/manifest.json, art/atlas-regions.json"
